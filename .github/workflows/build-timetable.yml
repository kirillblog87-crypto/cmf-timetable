
name: Build timetable app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip timetable-github-actions.zip

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
          components: llvm-tools

      - uses: astral-sh/setup-uv@v4

      - name: Install resvg
        run: |
          curl -sSfL -o "$RUNNER_TEMP/resvg.tar.gz" \
            https://github.com/linebender/resvg/releases/download/v0.49.0/resvg-linux-x86_64.tar.gz
          echo "216637e75e909e53e3098b0875cd5f7da2fdc8b4359771b4a29b539afff9d3f5  $RUNNER_TEMP/resvg.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/resvg.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cd apps-main && make build APP=timetable

      - uses: actions/upload-artifact@v4
        with:
          name: timetable-wp2app
          path: apps-main/target/timetable.wp2app
